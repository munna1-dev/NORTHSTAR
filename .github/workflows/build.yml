name: build
run-name: build ${{ inputs.id }}
on:
  workflow_dispatch:
    inputs:
      id:
        required: true
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ID: ${{ inputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jobs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        continue-on-error: true
        uses: android-actions/setup-android@v3
      - name: Check Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          ls "$ANDROID_HOME" || true
      - name: Unpack and read settings
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          [[ "$ID" =~ ^[a-f0-9]{8}$ ]]
          mkdir src
          unzip -q "jobs/$ID.zip" -d src
          cat > "$RUNNER_TEMP/cfg.js" <<'JS'
          const fs = require('fs');
          let c = {};
          try { c = JSON.parse(fs.readFileSync('src/androidbuilder.json', 'utf8')); } catch (e) {}
          const ok = (v, re, d) => (re.test(String(v)) ? String(v) : d);
          const o = {
            NAME: ok(c.name, /^[\p{L}\p{N} ._-]{1,40}$/u, 'App'),
            APPID: ok(c.id, /^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$/i, 'com.example.app'),
            VNAME: ok(c.versionName, /^[A-Za-z0-9._-]{1,20}$/, '1.0.0'),
            VCODE: ok(c.versionCode, /^[0-9]{1,9}$/, '1'),
            MINSDK: ok(c.minSdk, /^[0-9]{2}$/, '24'),
            TARGETSDK: ok(c.targetSdk, /^[0-9]{2}$/, '34')
          };
          const url = /^https?:\/\/[^\s"'<>\\]+$/i.test(String(c.url || '')) ? String(c.url) : '';
          o.TYPE = String(c.type || '') === 'url' ? 'url'
            : fs.existsSync('src/pubspec.yaml') ? 'flutter'
            : (fs.existsSync('src/settings.gradle') || fs.existsSync('src/settings.gradle.kts')) ? 'gradle' : 'web';
          const web = o.TYPE === 'url' || o.TYPE === 'web';
          o.RELEASE = web && (c.release === true || c.release === 'true') ? '1' : '0';
          o.TV = web && (c.tv === true || c.tv === 'true') ? '1' : '0';
          o.THEME = '#2563eb';
          const hx = (v) => (/^#[0-9a-f]{6}$/i.test(String(v || '')) ? String(v).toLowerCase() : '');
          const th = c.theme && typeof c.theme === 'object' ? c.theme : {};
          if (hx(th.primary)) { o.THEME = hx(th.primary); o.THEME_SET = '1'; }
          o.STATUSBAR = hx(th.statusBar); o.NAVBAR = hx(th.navBar); o.SPLASHBG = hx(th.splashBg);
          o.STATUSSTYLE = ['light', 'dark', 'auto'].includes(th.statusStyle) ? th.statusStyle : 'auto';
          const ft = c.features && typeof c.features === 'object' ? c.features : {};
          const fkeys = ['camera', 'gallery', 'uploads', 'downloads', 'location', 'push', 'share', 'biometric', 'statusBar', 'offline'];
          o.FEATURES = web ? fkeys.filter((k) => ft[k] === true || ft[k] === 'true').map((k) => k.toLowerCase()).join(',') : '';
          o.ABNATIVE = o.FEATURES.split(',').some((k) => ['camera', 'gallery', 'uploads', 'downloads', 'location', 'push', 'share', 'biometric', 'statusbar'].includes(k)) ? '1' : '0';
          o.HASGS = fs.existsSync('src/androidbuilder-google-services.json') ? '1' : '0';
          if (o.RELEASE === '1') o.TARGETSDK = '36';
          const iu = String(c.iconUrl || '');
          if (/^https?:\/\/[^\s"'<>\\]+$/i.test(iu)) o.ICONURL = iu;
          if (o.TYPE === 'url') {
            if (!url) { console.error('Missing or invalid url in androidbuilder.json'); process.exit(1); }
            o.URL = url;
          }
          fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(o).map(([k, v]) => k + '=' + v).join('\n') + '\n');
          JS
          node "$RUNNER_TEMP/cfg.js"
      - name: Scan website (name, icon, colour)
        if: env.TYPE == 'url'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          cat > "$RUNNER_TEMP/scan.js" <<'JS'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const UA = 'Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36';
          const start = process.env.URL;
          const get = async (u, bin) => {
            const r = await fetch(u, { headers: { 'User-Agent': UA, 'Accept-Language': 'en' }, redirect: 'follow', signal: AbortSignal.timeout(20000) });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            return bin ? { buf: Buffer.from(await r.arrayBuffer()), url: r.url } : { text: await r.text(), url: r.url };
          };
          const attrs = (tag) => { const o = {}; for (const m of tag.matchAll(/([A-Za-z:_-]+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g)) o[m[1].toLowerCase()] = (m[2] ?? m[3] ?? '').trim(); return o; };
          const tags = (html, name) => [...html.matchAll(new RegExp('<' + name + '\\b[^>]*>', 'gi'))].map((m) => attrs(m[0]));
          const size = (s) => Math.max(0, ...String(s || '').split(/\s+/).map((x) => parseInt(x, 10) || 0));
          const valid = (f) => { try { execFileSync('convert', [f + '[0]', '-resize', '16x16', 'null:'], { stdio: 'ignore' }); return true; } catch (e) { return false; } };
          (async () => {
            let html = '', base = start;
            try { const g = await get(start); html = g.text; base = g.url; } catch (e) { console.log('Could not read the page:', e.message); }
            const metas = tags(html, 'meta'), links = tags(html, 'link');
            const meta = (k) => (metas.find((m) => m.property === k || m.name === k) || {}).content || '';
            const host = new URL(base).hostname.replace(/^www\./, '');
            const rawTitle = meta('og:site_name') || ((html.match(/<title[^>]*>([^<]{1,120})/i) || [])[1] || '').trim() || host;
            let theme = meta('theme-color');
            if (/^#[0-9a-f]{3}$/i.test(theme)) theme = '#' + theme.slice(1).split('').map((x) => x + x).join('');
            if (!/^#[0-9a-f]{6}$/i.test(theme)) theme = '#2563eb';
            const cand = [];
            const add = (href, sz, pri) => { try { cand.push({ u: new URL(href, base).href, sz, pri }); } catch (e) {} };
            const man = links.find((l) => /manifest/i.test(l.rel || '') && l.href);
            if (man) {
              try {
                const mu = new URL(man.href, base).href;
                const mj = JSON.parse((await get(mu)).text);
                for (const i of mj.icons || []) if (i.src) add(new URL(i.src, mu).href, size(i.sizes), 3);
              } catch (e) {}
            }
            for (const l of links) if (/icon/i.test(l.rel || '') && l.href) add(l.href, size(l.sizes), /apple/i.test(l.rel) ? 2 : 1);
            add('/favicon.ico', 0, 0);
            cand.sort((a, b) => b.pri - a.pri || b.sz - a.sz);
            let icon = '';
            for (const c of cand.slice(0, 12)) {
              try {
                const g = await get(c.u, true);
                if (g.buf.length < 300) continue;
                fs.writeFileSync('icon.src', g.buf);
                if (valid('icon.src')) { icon = c.u; break; }
                fs.unlinkSync('icon.src');
              } catch (e) {}
            }
            let c = {};
            try { c = JSON.parse(fs.readFileSync('src/androidbuilder.json', 'utf8')); } catch (e) {}
            const nm = String(c.name || '').trim();
            const clean = rawTitle.replace(/[^\p{L}\p{N} ._-]/gu, ' ').replace(/\s+/g, ' ').trim().slice(0, 30);
            const out = {};
            if (process.env.THEME_SET !== '1') out.THEME = theme;
            if (!nm || /^auto$/i.test(nm)) out.NAME = clean || host.slice(0, 30);
            fs.appendFileSync(process.env.GITHUB_ENV, Object.entries(out).map(([k, v]) => k + '=' + v).join('\n') + '\n');
            console.log('Site: ' + base + '\nTitle: ' + rawTitle + '\nDescription: ' + meta('description').slice(0, 200) + '\nTheme: ' + theme + '\nIcon: ' + (icon || 'none found (letter icon will be used)'));
          })();
          JS
          node "$RUNNER_TEMP/scan.js"
      - name: Custom icon
        if: env.TYPE == 'url' || env.TYPE == 'web'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          rm -f custom.src
          if [ -f src/androidbuilder-icon.png ]; then
            cp src/androidbuilder-icon.png custom.src
          elif [ -n "$ICONURL" ]; then
            curl -fsSL --max-time 30 -A "Mozilla/5.0" -o custom.src "$ICONURL" || echo "Icon download failed, using the fallback icon"
            if [ -f custom.src ] && ! convert "custom.src[0]" -resize 16x16 null: 2>/dev/null && grep -qi '<html' custom.src; then
              echo "The icon link is a web page, looking for its image"
              U=$(grep -oiE '<meta[^>]+(og:image|twitter:image)[^>]*>' custom.src | grep -oE 'content="[^"]+"' | head -n1 | sed -e 's/^content="//' -e 's/"$//' | sed 's/&amp;/\&/g')
              if [ -n "$U" ]; then curl -fsSL --max-time 30 -A "Mozilla/5.0" -o custom.src "$U" || rm -f custom.src; else rm -f custom.src; fi
            fi
          fi
          if [ -f custom.src ]; then
            if convert "custom.src[0]" -resize 16x16 null: 2>/dev/null; then
              cp custom.src icon.src
              echo "Using the custom icon"
            else
              echo "The custom icon is not a valid image, ignoring it"
            fi
          fi
      - name: Make icons and TV banner
        if: env.TYPE == 'url' || env.TYPE == 'web'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          mkdir -p "$RUNNER_TEMP/icons"
          rm -f icon512.png
          if [ -f icon.src ]; then
            convert "icon.src[0]" -background none -resize 512x512 -gravity center -extent 512x512 icon512.png || rm -f icon512.png
          fi
          if [ ! -f icon512.png ] && [ "$TYPE" = url ]; then
            L=$(printf '%s' "$NAME" | cut -c1 | tr a-z A-Z)
            convert -size 512x512 "xc:$THEME" -gravity center -fill white -font DejaVu-Sans-Bold -pointsize 300 -annotate 0 "$L" icon512.png \
              || convert -size 512x512 "xc:$THEME" -gravity center -fill white -pointsize 300 -annotate 0 "$L" icon512.png \
              || convert -size 512x512 "xc:$THEME" icon512.png
          fi
          if [ -f icon512.png ]; then
            OPAQUE=$(convert icon512.png -format '%[opaque]' info: 2>/dev/null || echo False)
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              N="${d%%:*}"; R="${d#*:}"; L="${R%%:*}"; S="${R#*:}"; F=$((S*66/100))
              convert icon512.png -resize "${L}x${L}" "$RUNNER_TEMP/icons/$N.png"
              convert icon512.png -resize "${F}x${F}" -background none -gravity center -extent "${S}x${S}" "$RUNNER_TEMP/icons/$N-fg.png"
              if [ "$OPAQUE" = True ]; then
                convert icon512.png -resize "${S}x${S}^" -gravity center -extent "${S}x${S}" -blur "0x$((S/10))" "$RUNNER_TEMP/icons/$N-bg.png"
              else
                convert -size "${S}x${S}" xc:white "$RUNNER_TEMP/icons/$N-bg.png"
              fi
              convert "$RUNNER_TEMP/icons/$N-bg.png" "$RUNNER_TEMP/icons/$N-fg.png" -composite "$RUNNER_TEMP/icons/$N-comp.png"
            done
            echo "HASICONS=1" >> "$GITHUB_ENV"
          fi
          if [ "$TV" = 1 ]; then
            T="${NAME:0:18}"
            convert -size 320x180 "xc:$THEME" banner.png
            if [ -f icon512.png ]; then
              convert icon512.png -resize 84x84 icon84.png
              convert banner.png icon84.png -gravity north -geometry +0+14 -composite banner.png
            fi
            convert banner.png -gravity south -fill white -font DejaVu-Sans-Bold -pointsize 26 -annotate +0+14 "$T" banner2.png \
              || convert banner.png -gravity south -fill white -pointsize 26 -annotate +0+14 "$T" banner2.png \
              || cp banner.png banner2.png
            mv banner2.png "$RUNNER_TEMP/banner.png"
            echo "Created the Android TV banner"
          fi
      - name: Make splash screen
        if: env.TYPE == 'url' || env.TYPE == 'web'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          rm -f splash.src
          if [ -f src/androidbuilder-splash.png ]; then
            cp src/androidbuilder-splash.png splash.src
          elif [ -n "$SPLASHBG" ] && [ -f icon512.png ]; then
            cp icon512.png splash.src
          fi
          if [ -f splash.src ] && convert "splash.src[0]" -resize 16x16 null: 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/splash"
            convert "splash.src[0]" -background none -resize 640x640 -gravity center -extent 1152x1152 "$RUNNER_TEMP/splash/splash-icon.png"
            echo "HASSPLASH=1" >> "$GITHUB_ENV"
            echo "Created the splash screen image"
          fi
      - name: Signing key (Play Store)
        if: env.RELEASE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          mkdir -p "$RUNNER_TEMP/ks"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          K="$RUNNER_TEMP/keysrepo"
          if git clone -q --depth=1 -b keys "$URL" "$K" 2>/dev/null; then
            echo "Found the keys branch"
          else
            rm -rf "$K"
            git init -q -b keys "$K"
            git -C "$K" remote add origin "$URL"
          fi
          if [ -f "$K/$APPID.jks" ] && [ -f "$K/$APPID.pass" ]; then
            cp "$K/$APPID.jks" "$K/$APPID.pass" "$RUNNER_TEMP/ks/"
            echo "Using the existing signing key for $APPID"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ks/$APPID.jks" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=$NAME, O=$GITHUB_REPOSITORY_OWNER, C=US"
            printf '%s' "$P" > "$RUNNER_TEMP/ks/$APPID.pass"
            cp "$RUNNER_TEMP/ks/$APPID.jks" "$RUNNER_TEMP/ks/$APPID.pass" "$K/"
            git -C "$K" add -A
            git -C "$K" -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "key $APPID"
            git -C "$K" push -q origin HEAD:keys
            echo "Created a new signing key for $APPID and saved it on the keys branch"
          fi
          echo "::add-mask::$(cat "$RUNNER_TEMP/ks/$APPID.pass")"
          echo "KSPASS_FILE=$RUNNER_TEMP/ks/$APPID.pass" >> "$GITHUB_ENV"
      - name: Write build helpers
        if: env.TYPE == 'url' || env.TYPE == 'web'
        run: |
          set -e
          cat > "$RUNNER_TEMP/patch.js" <<'JS'
          const fs = require('fs');
          const e = process.env;
          const mode = e.MODE || 'full';
          const site = e.TYPE === 'url';
          let x = fs.readFileSync('config.xml', 'utf8');
          const esc = (s) => s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
          if (site) x = x.replace(/<content src="[^"]*"\s*\/>/, () => '<content src="' + esc(e.URL) + '" />');
          x = x.replace(/version="[^"]*"/, () => 'version="' + e.VNAME + '" android-versionCode="' + e.VCODE + '"');
          let add = '';
          if (site) {
            add += '    <access origin="*" />\n    <allow-navigation href="*" />\n';
            for (const p of ['http://*/*', 'https://*/*', 'tel:*', 'sms:*', 'mailto:*', 'geo:*']) add += '    <allow-intent href="' + p + '" />\n';
          }
          add += '    <preference name="android-minSdkVersion" value="' + e.MINSDK + '" />\n';
          add += '    <preference name="android-targetSdkVersion" value="' + e.TARGETSDK + '" />\n';
          if (site && mode !== 'minimal') add += '    <preference name="BackgroundColor" value="0xff' + e.THEME.slice(1) + '" />\n';
          let plat = '';
          const feats = ',' + String(e.FEATURES || '') + ',';
          const has = (f) => feats.includes(',' + f + ',');
          const lum = (h) => { const n = parseInt(h.slice(1), 16); return (0.2126 * ((n >> 16) & 255) + 0.7152 * ((n >> 8) & 255) + 0.0722 * (n & 255)) / 255; };
          if (mode === 'full' && (e.SPLASHBG || e.HASSPLASH === '1')) {
            add += '    <preference name="AndroidWindowSplashScreenBackground" value="' + (e.SPLASHBG || e.THEME) + '" />\n';
            if (e.HASSPLASH === '1') add += '    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/screen/android/splash-icon.png" />\n';
          }
          if (e.ABNATIVE === '1' && mode !== 'minimal') {
            add += '    <preference name="ABFeatures" value="' + feats.slice(1, -1) + '" />\n';
            add += '    <preference name="ABStatusBar" value="' + (e.STATUSBAR || e.THEME) + '" />\n';
            add += '    <preference name="ABNavBar" value="' + (e.NAVBAR || e.THEME) + '" />\n';
            add += '    <preference name="ABStatusStyle" value="' + (e.STATUSSTYLE || 'auto') + '" />\n';
            add += '    <preference name="ABSplashBg" value="' + (e.SPLASHBG || e.THEME) + '" />\n';
            add += '    <preference name="ABAppName" value="' + esc(e.NAME) + '" />\n';
            const perms = [];
            if (has('camera')) perms.push('CAMERA', 'RECORD_AUDIO');
            if (has('location')) perms.push('ACCESS_FINE_LOCATION', 'ACCESS_COARSE_LOCATION');
            if (has('push')) perms.push('POST_NOTIFICATIONS');
            if (has('biometric')) perms.push('USE_BIOMETRIC');
            let cf = '        <config-file target="AndroidManifest.xml" parent="/manifest">\n';
            for (const p of perms) cf += '            <uses-permission android:name="android.permission.' + p + '" />\n';
            if (has('camera') || has('downloads')) cf += '            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n';
            if (has('camera')) {
              cf += '            <uses-feature android:name="android.hardware.camera" android:required="false" />\n';
              cf += '            <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n';
            }
            cf += '        </config-file>\n';
            if (!/xmlns:android=/.test(x)) x = x.replace(/<widget /, () => '<widget xmlns:android="http://schemas.android.com/apk/res/android" ');
            plat += cf;
            if (e.ABPUSH === '1') plat += '        <resource-file src="google-services.json" target="app/google-services.json" />\n';
          }
          if (has('offline') && mode !== 'minimal') {
            const bg = e.THEME, fg = lum(bg) < 0.5 ? '#ffffff' : '#111111';
            const go = site ? e.URL : 'index.html';
            const page = '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline</title><style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;text-align:center;font:16px system-ui,sans-serif;background:' + bg + ';color:' + fg + ';padding:24px;box-sizing:border-box}h1{font-size:1.4rem;margin:.6em 0 .3em}p{opacity:.8;margin:0 0 1.2em}button{border:0;border-radius:24px;padding:12px 28px;font-size:1rem;background:' + fg + ';color:' + bg + '}.i{font-size:64px}</style></head><body><div><div class="i">📡</div><h1>You are offline</h1><p>Check your internet connection and try again.</p><button onclick="go()">Try again</button></div><script>var U=' + JSON.stringify(go) + ';function go(){location.href=U}window.addEventListener("online",go)</script></body></html>';
            fs.mkdirSync('www', { recursive: true });
            fs.writeFileSync('www/offline.html', page);
            add += '    <preference name="errorUrl" value="file:///android_asset/www/offline.html" />\n';
          }
          if (e.HASICONS === '1' && mode === 'full') {
            for (const d of ['mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi']) {
              plat += '        <icon density="' + d + '" src="res/icon/' + d + '.png"'
                + (mode === 'full' ? ' foreground="res/icon/' + d + '-fg.png" background="res/icon/' + d + '-bg.png"' : '') + ' />\n';
            }
          }
          if (e.TV === '1' && mode !== 'minimal') {
            if (!/xmlns:android=/.test(x)) x = x.replace(/<widget /, () => '<widget xmlns:android="http://schemas.android.com/apk/res/android" ');
            plat += '        <config-file target="AndroidManifest.xml" parent="/manifest">\n';
            plat += '            <uses-feature android:name="android.software.leanback" android:required="false" />\n';
            plat += '            <uses-feature android:name="android.hardware.touchscreen" android:required="false" />\n';
            plat += '        </config-file>\n';
            plat += '        <config-file target="AndroidManifest.xml" parent="/manifest/application/activity/intent-filter">\n';
            plat += '            <category android:name="android.intent.category.LEANBACK_LAUNCHER" />\n';
            plat += '        </config-file>\n';
            plat += '        <edit-config file="AndroidManifest.xml" target="/manifest/application" mode="merge">\n';
            plat += '            <application android:banner="@drawable/banner" />\n';
            plat += '        </edit-config>\n';
            plat += '        <resource-file src="res/banner.png" target="app/src/main/res/drawable/banner.png" />\n';
          }
          if (plat) {
            const re = /(<platform name="android">)([\s\S]*?)(<\/platform>)/;
            if (re.test(x)) x = x.replace(re, (m, a, b, c) => a + b + plat + '    ' + c);
            else add += '    <platform name="android">\n' + plat + '    </platform>\n';
          }
          x = x.replace('</widget>', () => add + '</widget>');
          fs.writeFileSync('config.xml', x);
          JS
          cat > "$RUNNER_TEMP/cbuild.sh" <<'SH'
          apply_icons() {
            R=platforms/android/app/src/main/res
            if [ ! -d "$R" ] || [ ! -f ../icon512.png ]; then return 0; fi
            OPQ=$(convert ../icon512.png -format '%[opaque]' info: 2>/dev/null || echo False)
            find "$R" -name 'ic_launcher*.webp' -delete
            for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
              N="${d%%:*}"; Q="${d#*:}"; L="${Q%%:*}"; S="${Q#*:}"; F=$((S*66/100)); D="$R/mipmap-$N"
              mkdir -p "$D"
              convert ../icon512.png -resize "${L}x${L}" "$D/ic_launcher.png"
              cp "$D/ic_launcher.png" "$D/ic_launcher_round.png"
              convert ../icon512.png -resize "${F}x${F}" -background none -gravity center -extent "${S}x${S}" "$D/ic_launcher_foreground.png"
              if [ "$OPQ" = True ]; then
                convert ../icon512.png -resize "${S}x${S}^" -gravity center -extent "${S}x${S}" -blur "0x$((S/10))" "$D/ic_launcher_background.png"
              else
                convert -size "${S}x${S}" xc:white "$D/ic_launcher_background.png"
              fi
            done
            mkdir -p "$R/mipmap-anydpi-v26"
            for n in ic_launcher ic_launcher_round; do
              printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' '    <background android:drawable="@mipmap/ic_launcher_background"/>' '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' '</adaptive-icon>' > "$R/mipmap-anydpi-v26/$n.xml"
            done
            echo "Applied the custom icon to the Android resources"
          }
          build_app() {
            echo "== Build attempt: $1"
            rm -rf app
            cordova create app "$APPID" "$NAME" || return 1
            cd app
            if [ "$TYPE" = web ]; then rm -rf www/*; cp -r ../src/. www/; rm -f www/androidbuilder-google-services.json www/androidbuilder-splash.png; fi
            if [ "${USE_PUSH:-0}" = 1 ]; then cp ../src/androidbuilder-google-services.json google-services.json; fi
            MODE="$1" ABNATIVE="${USE_NATIVE:-0}" ABPUSH="${USE_PUSH:-0}" node "$RUNNER_TEMP/patch.js" || { cd ..; return 1; }
            if [ "$1" = full ] && [ "${HASICONS:-}" = 1 ]; then mkdir -p res/icon && cp "$RUNNER_TEMP"/icons/*.png res/icon/; fi
            if [ "$1" = full ] && [ "${HASSPLASH:-}" = 1 ]; then mkdir -p res/screen/android && cp "$RUNNER_TEMP/splash/splash-icon.png" res/screen/android/; fi
            if [ "$1" != minimal ] && [ "${TV:-}" = 1 ]; then mkdir -p res && cp "$RUNNER_TEMP/banner.png" res/banner.png; fi
            PV=""
            if [ "${RELEASE:-}" = 1 ]; then PV="@15"; fi
            cordova platform add "android$PV" || { cd ..; return 1; }
            if [ "${USE_NATIVE:-0}" = 1 ] && [ "$1" != minimal ]; then cordova plugin add "$RUNNER_TEMP/abplugin" || { cd ..; return 1; }; fi
            if [ "${USE_PUSH:-0}" = 1 ] && [ "$1" != minimal ]; then cordova plugin add cordova-plugin-firebase-messaging || { cd ..; return 1; }; fi
            if { [ "$1" = full ] || [ "$1" = direct ]; } && [ "${HASICONS:-}" = 1 ]; then apply_icons || echo "Could not apply the icon directly"; fi
            if [ "${RELEASE:-}" = 1 ]; then
              PW=$(cat "$KSPASS_FILE")
              KS="$RUNNER_TEMP/ks/$APPID.jks"
              cordova build android --release -- --keystore="$KS" --storePassword="$PW" --alias=upload --password="$PW" --packageType=bundle || { cd ..; return 1; }
              cordova build android --release -- --keystore="$KS" --storePassword="$PW" --alias=upload --password="$PW" --packageType=apk || { cd ..; return 1; }
            else
              cordova build android --debug || { cd ..; return 1; }
            fi
            cd ..
          }
          run_build() {
            LAST=minimal
            if [ "${RELEASE:-}" = 1 ] || [ "${TV:-}" = 1 ]; then LAST=noicons; fi
            USE_NATIVE="${ABNATIVE:-0}"
            USE_PUSH=0
            if [ "${HASGS:-0}" = 1 ] && [ "$USE_NATIVE" = 1 ] && [[ ",${FEATURES:-}," == *,push,* ]]; then USE_PUSH=1; fi
            if build_app full; then
              echo "Built with the adaptive icon"
            elif [ "$USE_PUSH" = 1 ] && { USE_PUSH=0; build_app full; }; then
              echo "::warning title=Android Builder note::Firebase push could not be added to the build, so it is off. The other features were applied."
            elif [ "$USE_NATIVE" = 1 ] && { USE_PUSH=0; USE_NATIVE=0; build_app full; }; then
              echo "::warning title=Android Builder note::The native features could not be added to the build, so they are off. Open the log to see why."
            elif [ "${HASICONS:-}" = 1 ] && { USE_PUSH=0; USE_NATIVE=0; build_app direct; }; then
              echo "Built with the icon applied directly"
            else
              USE_PUSH=0; USE_NATIVE=0
              build_app "$LAST"
              if [ "${HASICONS:-}" = 1 ]; then echo "::warning title=Android Builder note::Your custom icon was NOT applied because the build failed with it."; fi
            fi
            if [ "${RELEASE:-}" = 1 ]; then
              cp app/platforms/android/app/build/outputs/bundle/release/app-release.aab app.aab
              cp app/platforms/android/app/build/outputs/apk/release/app-release.apk app.apk
            else
              cp app/platforms/android/app/build/outputs/apk/debug/app-debug.apk app.apk
            fi
          }
          SH
      - name: Write native plugin
        if: env.ABNATIVE == '1'
        run: |
          set -e
          P="$RUNNER_TEMP/abplugin"
          mkdir -p "$P/src/android"
          cat > "$P/plugin.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <plugin xmlns="http://apache.org/cordova/ns/plugins/1.0" xmlns:android="http://schemas.android.com/apk/res/android" id="ab-native" version="1.0.0">
            <name>ABNative</name>
            <platform name="android">
              <config-file target="res/xml/config.xml" parent="/*">
                <feature name="ABNative">
                  <param name="android-package" value="com.androidbuilder.ABNative" />
                  <param name="onload" value="true" />
                </feature>
              </config-file>
              <source-file src="src/android/ABNative.java" target-dir="src/com/androidbuilder" />
              <framework src="androidx.biometric:biometric:1.1.0" />
            </platform>
          </plugin>
          XML
          cat > "$P/src/android/ABNative.java" <<'JAVA'
          package com.androidbuilder;

          import android.Manifest;
          import android.app.Activity;
          import android.app.DownloadManager;
          import android.content.ActivityNotFoundException;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.Window;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.URLUtil;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import android.widget.Toast;

          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.core.graphics.ColorUtils;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import androidx.fragment.app.FragmentActivity;

          import org.apache.cordova.CordovaInterface;
          import org.apache.cordova.CordovaPlugin;
          import org.apache.cordova.CordovaWebView;
          import org.apache.cordova.engine.SystemWebChromeClient;
          import org.apache.cordova.engine.SystemWebViewEngine;
          import org.json.JSONObject;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.concurrent.Executor;

          /**
           * Android Builder native bridge. Every feature is switched on from config.xml
           * (preference "ABFeatures"), so a feature that is not selected adds no behaviour.
           */
          public class ABNative extends CordovaPlugin {
              private static final int REQ_FILE = 7201;
              private static final long RELOCK_MS = 30000L;

              private String features = ",";
              private int statusColor = Color.TRANSPARENT;
              private int navColor = Color.TRANSPARENT;
              private int splashColor = Color.WHITE;
              private String statusStyle = "auto";
              private String appName = "";

              private final HashMap<Integer, Runnable[]> pending = new HashMap<Integer, Runnable[]>();
              private int nextReq = 7300;
              private final HashSet<String> blobTokens = new HashSet<String>();

              private ValueCallback<Uri[]> fileCb;
              private Uri cameraUri;

              private View cover;
              private boolean prompting = false;
              private boolean unlocked = false;
              private long pausedAt = 0L;

              private boolean has(String f) {
                  return features.contains("," + f + ",");
              }

              private static int parse(String s, int d) {
                  try {
                      return Color.parseColor(s);
                  } catch (Throwable t) {
                      return d;
                  }
              }

              @Override
              public void initialize(CordovaInterface cordova, CordovaWebView webView) {
                  super.initialize(cordova, webView);
                  features = "," + preferences.getString("ABFeatures", "").toLowerCase() + ",";
                  statusColor = parse(preferences.getString("ABStatusBar", ""), Color.TRANSPARENT);
                  navColor = parse(preferences.getString("ABNavBar", ""), Color.TRANSPARENT);
                  splashColor = parse(preferences.getString("ABSplashBg", ""), Color.WHITE);
                  statusStyle = preferences.getString("ABStatusStyle", "auto");
                  appName = preferences.getString("ABAppName", "");
                  cordova.getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              setup();
                          } catch (Throwable t) {
                              // a failing feature must never stop the app from opening
                          }
                      }
                  });
              }

              private void setup() {
                  final Activity act = cordova.getActivity();
                  View v = webView.getView();
                  if (!(v instanceof WebView)) return;
                  WebView wv = (WebView) v;

                  if (has("downloads")) {
                      wv.setDownloadListener(new android.webkit.DownloadListener() {
                          @Override
                          public void onDownloadStart(String url, String ua, String cd, String mime, long len) {
                              handleDownload(url, ua, cd, mime);
                          }
                      });
                  }
                  if (has("share") || has("downloads")) {
                      wv.addJavascriptInterface(new Bridge(), "ABNative");
                  }
                  if ((has("camera") || has("gallery") || has("uploads") || has("location"))
                          && webView.getEngine() instanceof SystemWebViewEngine) {
                      wv.setWebChromeClient(new Chrome((SystemWebViewEngine) webView.getEngine()));
                  }
                  if (has("statusbar")) applyBars(act);
                  if (has("push") && Build.VERSION.SDK_INT >= 33) {
                      ask(new String[]{"android.permission.POST_NOTIFICATIONS"}, noop(), noop());
                  }
                  if (has("biometric")) lockApp(act);
              }

              private static Runnable noop() {
                  return new Runnable() {
                      @Override
                      public void run() {
                      }
                  };
              }

              // ------------------------------------------------------------ permissions

              private void ask(String[] perms, Runnable ok, Runnable no) {
                  boolean all = true;
                  for (String p : perms) {
                      if (!cordova.hasPermission(p)) all = false;
                  }
                  if (all) {
                      ok.run();
                      return;
                  }
                  int code = ++nextReq;
                  pending.put(code, new Runnable[]{ok, no});
                  cordova.requestPermissions(this, code, perms);
              }

              @Override
              public void onRequestPermissionResult(int code, String[] perms, int[] results) {
                  Runnable[] r = pending.remove(code);
                  if (r == null) return;
                  boolean ok = results.length > 0;
                  for (int g : results) {
                      if (g != PackageManager.PERMISSION_GRANTED) ok = false;
                  }
                  (ok ? r[0] : r[1]).run();
              }

              private static String[] storagePerms() {
                  if (Build.VERSION.SDK_INT < 29) {
                      return new String[]{Manifest.permission.WRITE_EXTERNAL_STORAGE};
                  }
                  return new String[0];
              }

              // ------------------------------------------------------------ web chrome

              private class Chrome extends SystemWebChromeClient {
                  Chrome(SystemWebViewEngine engine) {
                      super(engine);
                  }

                  @Override
                  public void onPermissionRequest(final PermissionRequest request) {
                      final List<String> grant = new ArrayList<String>();
                      final List<String> need = new ArrayList<String>();
                      for (String r : request.getResources()) {
                          if (has("camera") && PermissionRequest.RESOURCE_VIDEO_CAPTURE.equals(r)) {
                              grant.add(r);
                              need.add(Manifest.permission.CAMERA);
                          } else if (has("camera") && PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(r)) {
                              grant.add(r);
                              need.add(Manifest.permission.RECORD_AUDIO);
                          }
                      }
                      if (grant.isEmpty()) {
                          request.deny();
                          return;
                      }
                      ask(need.toArray(new String[0]), new Runnable() {
                          @Override
                          public void run() {
                              request.grant(grant.toArray(new String[0]));
                          }
                      }, new Runnable() {
                          @Override
                          public void run() {
                              request.deny();
                          }
                      });
                  }

                  @Override
                  public void onGeolocationPermissionsShowPrompt(final String origin, final GeolocationPermissions.Callback cb) {
                      if (!has("location")) {
                          cb.invoke(origin, false, false);
                          return;
                      }
                      ask(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION},
                              new Runnable() {
                                  @Override
                                  public void run() {
                                      cb.invoke(origin, true, false);
                                  }
                              }, new Runnable() {
                                  @Override
                                  public void run() {
                                      cb.invoke(origin, false, false);
                                  }
                              });
                  }

                  @Override
                  public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> cb, final FileChooserParams params) {
                      if (fileCb != null) {
                          fileCb.onReceiveValue(null);
                          fileCb = null;
                      }
                      fileCb = cb;
                      cameraUri = null;

                      String[] accept = params.getAcceptTypes();
                      boolean any = true, hasImage = false, hasVideo = false, mediaOnly = true;
                      if (accept != null) {
                          for (String a : accept) {
                              if (a == null || a.trim().isEmpty()) continue;
                              any = false;
                              String t = a.trim().toLowerCase();
                              if (t.startsWith("image/")) hasImage = true;
                              else if (t.startsWith("video/")) hasVideo = true;
                              else mediaOnly = false;
                          }
                      }
                      if (any) mediaOnly = false;
                      final boolean allowPick = mediaOnly ? (has("gallery") || has("uploads")) : has("uploads");
                      final boolean wantImage = any || hasImage;
                      final boolean wantVideo = hasVideo;
                      final boolean allowCamera = has("camera") && (wantImage || wantVideo);

                      if (!allowPick && !allowCamera) {
                          finishFile(null);
                          return true;
                      }

                      final Intent pick = allowPick ? params.createIntent() : null;
                      if (!allowCamera) {
                          launchChooser(pick, null);
                          return true;
                      }

                      final boolean video = wantVideo && !wantImage;
                      final List<String> need = new ArrayList<String>();
                      need.add(Manifest.permission.CAMERA);
                      for (String s : storagePerms()) need.add(s);
                      ask(need.toArray(new String[0]), new Runnable() {
                          @Override
                          public void run() {
                              Intent cam = buildCamera(video);
                              if (cam == null && pick == null) {
                                  finishFile(null);
                                  return;
                              }
                              launchChooser(pick, cam);
                          }
                      }, new Runnable() {
                          @Override
                          public void run() {
                              if (pick != null) launchChooser(pick, null);
                              else finishFile(null);
                          }
                      });
                      return true;
                  }
              }

              private Intent buildCamera(boolean video) {
                  try {
                      Activity act = cordova.getActivity();
                      if (video) {
                          return new Intent(MediaStore.ACTION_VIDEO_CAPTURE);
                      }
                      ContentValues cv = new ContentValues();
                      cv.put(MediaStore.Images.Media.DISPLAY_NAME, "photo_" + System.currentTimeMillis() + ".jpg");
                      cv.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                      Uri u = act.getContentResolver().insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, cv);
                      if (u == null) return null;
                      cameraUri = u;
                      Intent i = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      i.putExtra(MediaStore.EXTRA_OUTPUT, u);
                      i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      return i;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private void launchChooser(Intent pick, Intent cam) {
                  try {
                      Intent launch;
                      if (pick != null) {
                          launch = Intent.createChooser(pick, "Choose");
                          if (cam != null) launch.putExtra(Intent.EXTRA_INITIAL_INTENTS, new Intent[]{cam});
                      } else if (cam != null) {
                          launch = cam;
                      } else {
                          finishFile(null);
                          return;
                      }
                      cordova.startActivityForResult(this, launch, REQ_FILE);
                  } catch (ActivityNotFoundException e) {
                      finishFile(null);
                  } catch (Throwable t) {
                      finishFile(null);
                  }
              }

              private void finishFile(Uri[] result) {
                  ValueCallback<Uri[]> cb = fileCb;
                  fileCb = null;
                  if (cb != null) cb.onReceiveValue(result);
              }

              @Override
              public void onActivityResult(int req, int res, Intent data) {
                  if (req != REQ_FILE) return;
                  Uri[] result = null;
                  if (res == Activity.RESULT_OK) {
                      result = WebChromeClient.FileChooserParams.parseResult(res, data);
                      if (result == null && cameraUri != null) result = new Uri[]{cameraUri};
                  }
                  if (result == null && cameraUri != null) {
                      try {
                          cordova.getActivity().getContentResolver().delete(cameraUri, null, null);
                      } catch (Throwable t) {
                          // ignore
                      }
                  }
                  cameraUri = null;
                  finishFile(result);
              }

              // ------------------------------------------------------------ downloads

              private void toast(final String msg) {
                  cordova.getActivity().runOnUiThread(new Runnable() {
                      @Override
                      public void run() {
                          Toast.makeText(cordova.getActivity(), msg, Toast.LENGTH_LONG).show();
                      }
                  });
              }

              private void handleDownload(final String url, final String ua, final String cd, final String mime) {
                  final String name = URLUtil.guessFileName(url, cd, mime);
                  if (url.startsWith("blob:")) {
                      final String token = Long.toHexString(System.nanoTime()) + Long.toHexString((long) (Math.random() * 1e12));
                      synchronized (blobTokens) {
                          blobTokens.add(token);
                      }
                      final String js = "(function(u,n,k){fetch(u).then(function(r){return r.blob();}).then(function(b){"
                              + "var f=new FileReader();f.onloadend=function(){ABNative.saveBase64(k,n,b.type,String(f.result).split(',')[1]||'');};"
                              + "f.readAsDataURL(b);});})(" + JSONObject.quote(url) + "," + JSONObject.quote(name) + "," + JSONObject.quote(token) + ");";
                      cordova.getActivity().runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              ((WebView) webView.getView()).evaluateJavascript(js, null);
                          }
                      });
                      return;
                  }
                  if (url.startsWith("data:")) {
                      try {
                          int comma = url.indexOf(',');
                          String head = url.substring(5, comma);
                          String body = url.substring(comma + 1);
                          byte[] bytes = head.contains(";base64") ? Base64.decode(body, Base64.DEFAULT) : Uri.decode(body).getBytes("UTF-8");
                          String m = head.split(";")[0];
                          saveBytes(name, m.isEmpty() ? "application/octet-stream" : m, bytes);
                      } catch (Throwable t) {
                          toast("Download failed");
                      }
                      return;
                  }
                  ask(storagePerms(), new Runnable() {
                      @Override
                      public void run() {
                          try {
                              DownloadManager.Request r = new DownloadManager.Request(Uri.parse(url));
                              if (mime != null && !mime.isEmpty()) r.setMimeType(mime);
                              String cookie = CookieManager.getInstance().getCookie(url);
                              if (cookie != null) r.addRequestHeader("Cookie", cookie);
                              if (ua != null) r.addRequestHeader("User-Agent", ua);
                              r.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                              r.setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, name);
                              DownloadManager dm = (DownloadManager) cordova.getActivity().getSystemService(Context.DOWNLOAD_SERVICE);
                              dm.enqueue(r);
                              toast("Downloading " + name);
                          } catch (Throwable t) {
                              toast("Download failed");
                          }
                      }
                  }, new Runnable() {
                      @Override
                      public void run() {
                          toast("Storage permission is needed to save files");
                      }
                  });
              }

              private void saveBytes(final String name, final String mime, final byte[] bytes) {
                  final Activity act = cordova.getActivity();
                  ask(storagePerms(), new Runnable() {
                      @Override
                      public void run() {
                          new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  try {
                                      if (Build.VERSION.SDK_INT >= 29) {
                                          ContentValues v = new ContentValues();
                                          v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                                          Uri u = act.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                                          OutputStream o = act.getContentResolver().openOutputStream(u);
                                          o.write(bytes);
                                          o.close();
                                      } else {
                                          File d = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                                          d.mkdirs();
                                          FileOutputStream o = new FileOutputStream(new File(d, name));
                                          o.write(bytes);
                                          o.close();
                                      }
                                      toast("Saved " + name + " to Downloads");
                                  } catch (Throwable t) {
                                      toast("Could not save " + name);
                                  }
                              }
                          }).start();
                      }
                  }, new Runnable() {
                      @Override
                      public void run() {
                          toast("Storage permission is needed to save files");
                      }
                  });
              }

              // ------------------------------------------------------------ JS bridge + page hook

              private class Bridge {
                  @JavascriptInterface
                  public void share(final String title, final String text, final String url) {
                      cordova.getActivity().runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  Intent i = new Intent(Intent.ACTION_SEND);
                                  i.setType("text/plain");
                                  String body = ((text == null ? "" : text) + " " + (url == null ? "" : url)).trim();
                                  i.putExtra(Intent.EXTRA_TEXT, body);
                                  if (title != null && !title.isEmpty()) i.putExtra(Intent.EXTRA_SUBJECT, title);
                                  cordova.getActivity().startActivity(Intent.createChooser(i, null));
                              } catch (Throwable t) {
                                  // ignore
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void saveBase64(String token, String name, String mime, String data) {
                      synchronized (blobTokens) {
                          if (!blobTokens.remove(token)) return;
                      }
                      try {
                          saveBytes(name, mime == null || mime.isEmpty() ? "application/octet-stream" : mime, Base64.decode(data, Base64.DEFAULT));
                      } catch (Throwable t) {
                          toast("Download failed");
                      }
                  }
              }

              private static final String SHARE_JS = "(function(){if(window.__abShare)return;window.__abShare=1;try{"
                      + "Object.defineProperty(navigator,'share',{configurable:true,writable:true,value:function(d){d=d||{};"
                      + "try{ABNative.share(String(d.title||''),String(d.text||''),String(d.url||''));return Promise.resolve();}"
                      + "catch(e){return Promise.reject(e);}}});"
                      + "Object.defineProperty(navigator,'canShare',{configurable:true,writable:true,value:function(d){return !(d&&d.files&&d.files.length);}});"
                      + "}catch(e){}})();";

              @Override
              public Object onMessage(String id, Object data) {
                  if ("onPageFinished".equals(id) && has("share")) {
                      cordova.getActivity().runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  ((WebView) webView.getView()).evaluateJavascript(SHARE_JS, null);
                              } catch (Throwable t) {
                                  // ignore
                              }
                          }
                      });
                  }
                  return null;
              }

              // ------------------------------------------------------------ status bar + navigation bar

              private void applyBars(Activity act) {
                  final Window w = act.getWindow();
                  final View decor = w.getDecorView();
                  if (statusColor == Color.TRANSPARENT && navColor == Color.TRANSPARENT) return;
                  int sc = statusColor == Color.TRANSPARENT ? navColor : statusColor;
                  int nc = navColor == Color.TRANSPARENT ? statusColor : navColor;
                  try {
                      w.addFlags(android.view.WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      w.setStatusBarColor(sc);
                      w.setNavigationBarColor(nc);
                  } catch (Throwable t) {
                      // newer Android versions ignore these calls when the app is edge-to-edge
                  }
                  try {
                      WindowInsetsControllerCompat c = WindowCompat.getInsetsController(w, decor);
                      boolean lightIcons;
                      if ("light".equals(statusStyle)) lightIcons = true;
                      else if ("dark".equals(statusStyle)) lightIcons = false;
                      else lightIcons = ColorUtils.calculateLuminance(sc) < 0.5;
                      c.setAppearanceLightStatusBars(!lightIcons);
                      c.setAppearanceLightNavigationBars(ColorUtils.calculateLuminance(nc) >= 0.5);
                  } catch (Throwable t) {
                      // ignore
                  }
                  if (Build.VERSION.SDK_INT >= 35 && act.getApplicationInfo().targetSdkVersion >= 35 && decor instanceof FrameLayout) {
                      // edge-to-edge is enforced: paint the bar areas ourselves
                      final FrameLayout d = (FrameLayout) decor;
                      final View top = new View(act);
                      top.setBackgroundColor(sc);
                      final View bottom = new View(act);
                      bottom.setBackgroundColor(nc);
                      d.addView(top, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, Gravity.TOP));
                      d.addView(bottom, new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, Gravity.BOTTOM));
                      ViewCompat.setOnApplyWindowInsetsListener(d, new androidx.core.view.OnApplyWindowInsetsListener() {
                          @Override
                          public WindowInsetsCompat onApplyWindowInsets(View v, WindowInsetsCompat insets) {
                              Insets b = insets.getInsets(WindowInsetsCompat.Type.systemBars());
                              top.getLayoutParams().height = b.top;
                              bottom.getLayoutParams().height = b.bottom;
                              top.requestLayout();
                              bottom.requestLayout();
                              return ViewCompat.onApplyWindowInsets(v, insets);
                          }
                      });
                      ViewCompat.requestApplyInsets(d);
                  }
              }

              // ------------------------------------------------------------ biometric lock

              private int authenticators() {
                  if (Build.VERSION.SDK_INT >= 30) {
                      return BiometricManager.Authenticators.BIOMETRIC_WEAK | BiometricManager.Authenticators.DEVICE_CREDENTIAL;
                  }
                  return BiometricManager.Authenticators.BIOMETRIC_WEAK;
              }

              private void lockApp(final Activity act) {
                  if (!(act instanceof FragmentActivity)) return;
                  try {
                      // nothing enrolled on the phone: do not lock the user out of the app
                      if (BiometricManager.from(act).canAuthenticate(authenticators()) != BiometricManager.BIOMETRIC_SUCCESS) return;
                  } catch (Throwable t) {
                      return;
                  }
                  unlocked = false;
                  if (cover == null) {
                      cover = new View(act);
                      cover.setBackgroundColor(splashColor);
                      cover.setClickable(true);
                      ((ViewGroup) act.getWindow().getDecorView()).addView(cover,
                              new FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  }
                  cover.setVisibility(View.VISIBLE);
                  cover.bringToFront();
                  showPrompt((FragmentActivity) act);
              }

              private void showPrompt(final FragmentActivity act) {
                  if (prompting) return;
                  prompting = true;
                  Executor ex = ContextCompat.getMainExecutor(act);
                  BiometricPrompt bp = new BiometricPrompt(act, ex, new BiometricPrompt.AuthenticationCallback() {
                      @Override
                      public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                          prompting = false;
                          unlocked = true;
                          if (cover != null) cover.setVisibility(View.GONE);
                      }

                      @Override
                      public void onAuthenticationError(int code, CharSequence msg) {
                          prompting = false;
                          act.finish();
                      }
                  });
                  BiometricPrompt.PromptInfo.Builder b = new BiometricPrompt.PromptInfo.Builder()
                          .setTitle(appName.isEmpty() ? "Unlock" : appName)
                          .setSubtitle("Verify it is you to continue")
                          .setAllowedAuthenticators(authenticators());
                  if (Build.VERSION.SDK_INT < 30) b.setNegativeButtonText("Cancel");
                  bp.authenticate(b.build());
              }

              @Override
              public void onPause(boolean multitasking) {
                  pausedAt = System.currentTimeMillis();
              }

              @Override
              public void onResume(boolean multitasking) {
                  if (has("biometric") && unlocked && !prompting && pausedAt > 0 && System.currentTimeMillis() - pausedAt > RELOCK_MS) {
                      lockApp(cordova.getActivity());
                  }
              }
          }
          JAVA
      - name: Build app (Cordova)
        if: env.TYPE == 'url' || env.TYPE == 'web'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          npm i -g cordova
          source "$RUNNER_TEMP/cbuild.sh"
          run_build
      - uses: gradle/actions/setup-gradle@v4
        if: env.TYPE == 'gradle'
        with:
          gradle-version: 8.7
      - name: Build Android project (Gradle)
        if: env.TYPE == 'gradle'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          cd src
          rm -f local.properties
          [ -f gradle.properties ] && sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon; else gradle assembleDebug --no-daemon; fi
          APK=$(find . -path '*build/outputs/apk/debug/*.apk' | head -n1)
          cp "$APK" ../app.apk
      - uses: subosito/flutter-action@v2
        if: env.TYPE == 'flutter'
        with:
          channel: stable
      - name: Build Flutter app
        if: env.TYPE == 'flutter'
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          cd src
          flutter build apk --release --target-platform android-arm64 --build-name "$VNAME" --build-number "$VCODE"
          cp build/app/outputs/flutter-apk/app-release.apk ../app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.id }}
          path: |
            app.apk
            app.aab
          retention-days: 3
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exec > >(tee -a "$RUNNER_TEMP/build.log") 2>&1
          test -f app.apk
          P="$RUNNER_TEMP/pub"
          mkdir -p "$P"
          cp app.apk "$P/$ID.apk"
          if [ -f app.aab ]; then cp app.aab "$P/$ID.aab"; fi
          cd "$P"
          git init -q -b out
          git add -A
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "apk $ID"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/out
      - name: Report error
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            MSG=$(grep -iE "error|fail|exception|not found|invalid|cannot|unable|denied" "$RUNNER_TEMP/build.log" | tail -n 10 | cut -c1-260 | tr -d '%\r' | sed -E 's/(assword|storePassword)=[^ ]+/\1=***/g' | tr '\n' '|')
            [ -n "$MSG" ] || MSG=$(tail -n 6 "$RUNNER_TEMP/build.log" | cut -c1-260 | tr -d '%\r' | tr '\n' '|')
            echo "::error title=Build error::$MSG"
          fi
      - name: Delete uploaded source
        if: always()
        run: |
          git rm -q "jobs/$ID.zip" || true
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "clean $ID" || true
          git push origin HEAD:jobs || true
